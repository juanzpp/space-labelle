name: Space LaBelle validation
on:
  push:
    branches: [migration-naile-source]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Verify required image files
        run: |
          test -f src/assets/nail-hero.jpg
          test -f src/assets/nails-cherry.jpg
          test -f src/assets/nails-french.jpg
      - name: Build
        run: bun run build
      - name: Unit tests
        run: bun run test
